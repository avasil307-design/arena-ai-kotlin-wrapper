name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/739ac183-arena-ai-kotlin-wrapper
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Arena APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run lint
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arena-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
